services:
  web:
    container_name: nextjs-app

    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

    expose:
      - "3000"

    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: caddy-server

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - web

    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
